
title: "Vanct's Blog"
description: "Research, Notes and Life"
url: "https://van-cheta.github.io"
baseurl: ""

author: "Vanct"
lang: zh-CN

markdown: kramdown
permalink: /:year/:month/:day/:title/

# 东莞等中国大陆城市统一使用 UTC+8，此处填写标准时区标识。
timezone: Asia/Shanghai

highlighter: rouge
kramdown:
  input: GFM
  math_engine: mathjax

# 新文章默认使用文章模板，并支持数学公式。
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      math: true

exclude:
  - README.md
  - docs
  - Gemfile
  - Gemfile.lock
  - vendor
